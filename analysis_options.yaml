include: package:lints/recommended.yaml

analyzer:
  exclude:
    - flutter/**
    - .worktrees/**
    - .tooling/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unused_import: error
    unused_local_variable: error
    dead_code: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_super_parameters
